<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Village Setu · Login</title>
  <link rel="preconnect" href="https://cdn.tailwindcss.com" crossorigin />
  <link rel="dns-prefetch" href="https://cdn.tailwindcss.com" />
  <style>
    html,body{margin:0;padding:0;background:#0f172a;color:#e2e8f0;font-family:system-ui,-apple-system,'Segoe UI',sans-serif}
  </style>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' };</script>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-900 via-indigo-950 to-purple-950 p-4">
  <div class="absolute inset-0 overflow-hidden pointer-events-none">
    <div class="absolute -top-40 -right-40 w-96 h-96 bg-indigo-500/20 rounded-full blur-3xl"></div>
    <div class="absolute -bottom-40 -left-40 w-96 h-96 bg-purple-500/20 rounded-full blur-3xl"></div>
  </div>

  <div class="relative w-full max-w-md">
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-br from-indigo-500 to-purple-600 text-white font-bold text-2xl shadow-lg shadow-indigo-500/30">VS</div>
      <h1 class="mt-4 text-3xl font-bold text-white">Village Setu</h1>
      <p class="mt-1 text-sm text-slate-400">Government Database Management System</p>
    </div>

    <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-2xl p-8">
      <h2 class="text-xl font-semibold text-slate-800 dark:text-white mb-1">Welcome back</h2>
      <p class="text-sm text-slate-500 dark:text-slate-400 mb-6">Sign in to access your dashboard</p>

      <form id="login-form" class="space-y-4">
        <div>
          <label for="email" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Email address</label>
          <input id="email" name="email" type="email" autocomplete="username" required
            class="w-full px-4 py-2.5 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-800 dark:text-white focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none transition"
            placeholder="admin@villagesetu.gov.in" />
        </div>
        <div>
          <label for="password" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Password</label>
          <div class="relative">
            <input id="password" name="password" type="password" autocomplete="current-password" required
              class="w-full px-4 py-2.5 pr-12 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-800 dark:text-white focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none transition"
              placeholder="••••••••" />
            <button type="button" id="toggle-pw" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 text-sm">Show</button>
          </div>
        </div>

        <div id="error-msg" class="hidden text-sm text-rose-600 dark:text-rose-400 bg-rose-50 dark:bg-rose-900/30 border border-rose-200 dark:border-rose-800 rounded-lg p-3"></div>

        <button type="submit" id="submit-btn"
          class="w-full py-2.5 px-4 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 text-white font-medium rounded-lg shadow-lg shadow-indigo-500/30 transition disabled:opacity-50 disabled:cursor-not-allowed">
          <span id="btn-text">Sign In</span>
          <svg id="btn-spinner" class="hidden animate-spin mx-auto h-5 w-5 text-white" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
          </svg>
        </button>
      </form>

      <div class="mt-6 pt-6 border-t border-slate-200 dark:border-slate-700">
        <p class="text-xs text-slate-500 dark:text-slate-400 text-center">
          Default admin credentials are set via <code class="px-1 py-0.5 bg-slate-100 dark:bg-slate-700 rounded">ADMIN_EMAIL</code> and <code class="px-1 py-0.5 bg-slate-100 dark:bg-slate-700 rounded">ADMIN_PASSWORD</code> environment variables.
        </p>
      </div>
    </div>

    <p class="text-center mt-6 text-xs text-slate-400">
      &copy; <span id="yr"></span> Village Setu · Government of India Portal
    </p>
  </div>

  <script src="/js/api.js"></script>
  <script>
    document.getElementById('yr').textContent = new Date().getFullYear();
    // Redirect if already logged in
    if (window.auth.getToken() && window.auth.getUser()) {
      window.location.replace('/dashboard.html');
    }

    document.getElementById('toggle-pw').addEventListener('click', (e) => {
      const inp = document.getElementById('password');
      const isPw = inp.type === 'password';
      inp.type = isPw ? 'text' : 'password';
      e.target.textContent = isPw ? 'Hide' : 'Show';
    });

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim().toLowerCase();
      const password = document.getElementById('password').value;
      const errEl = document.getElementById('error-msg');
      const btn = document.getElementById('submit-btn');
      const txt = document.getElementById('btn-text');
      const spin = document.getElementById('btn-spinner');

      errEl.classList.add('hidden');
      btn.disabled = true; txt.classList.add('hidden'); spin.classList.remove('hidden');

      try {
        const res = await window.api.post('/auth/login', { email, password });
        window.auth.setToken(res.access_token);
        window.auth.setUser(res.user);
        window.location.href = '/dashboard.html';
      } catch (err) {
        errEl.textContent = err.message || 'Login failed.';
        errEl.classList.remove('hidden');
        btn.disabled = false; txt.classList.remove('hidden'); spin.classList.add('hidden');
      }
    });
  </script>
</body>
</html>
