<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Village Setu · Families</title>
  <style>
    html,body{margin:0;padding:0;background:#f8fafc;color:#1e293b;font-family:system-ui,-apple-system,sans-serif}
    html.dark{background:#0f172a;color:#e2e8f0}
    #app{min-height:100vh}
    .spinner{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:inherit;z-index:9999}
    .spinner::after{content:'';width:40px;height:40px;border:3px solid #cbd5e1;border-top-color:#4f46e5;border-radius:50%;animation:spin 0.8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
  <script>(function(){var t=localStorage.getItem('vs_theme')||'light';if(t==='dark')document.documentElement.classList.add('dark');})();</script>
  <link rel="stylesheet" href="/css/tailwind.css" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body class="bg-slate-50 dark:bg-slate-900">
  <div id="app"><div class="spinner"></div></div>
  <script src="/js/api.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/pages/families.js"></script>
</body>
</html>
