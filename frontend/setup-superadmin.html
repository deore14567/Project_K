<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Super Admin Setup · आशापुरी कॉम्प्युटर सर्विस कर्ले</title>
  <style>
    html,body{margin:0;padding:0;background:#0f172a;color:#e2e8f0;font-family:system-ui,-apple-system,'Segoe UI',sans-serif}
  </style>
  <link rel="stylesheet" href="/css/tailwind.css" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-900 via-indigo-950 to-purple-950 p-4">
  <div class="absolute inset-0 overflow-hidden pointer-events-none">
    <div class="absolute -top-40 -right-40 w-96 h-96 bg-indigo-500/20 rounded-full blur-3xl"></div>
    <div class="absolute -bottom-40 -left-40 w-96 h-96 bg-purple-500/20 rounded-full blur-3xl"></div>
  </div>

  <div class="relative w-full max-w-md">
    <div class="text-center mb-8">
      <img src="/assets/logo.jpeg" alt="Logo" class="inline-block w-16 h-16 rounded-2xl object-cover shadow-lg shadow-indigo-500/30 mb-3" />
      <h1 class="text-2xl font-bold text-white">Super Admin Setup</h1>
      <p class="mt-1 text-sm text-slate-400">आशापुरी कॉम्प्युटर सर्विस कर्ले 💻</p>
    </div>

    <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-2xl p-8">
      <h2 class="text-lg font-semibold text-slate-800 dark:text-white mb-1">Set Super Admin Password</h2>
      <p class="text-sm text-slate-500 dark:text-slate-400 mb-6">Enter the setup key and choose a password for the hidden super admin account.</p>

      <form id="setup-form" class="space-y-4">
        <div>
          <label for="key" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Setup Key</label>
          <input id="key" name="key" type="password" required
            class="w-full px-4 py-2.5 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-800 dark:text-white focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none transition"
            placeholder="Enter the setup key" />
        </div>
        <div>
          <label for="password" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">New Password</label>
          <div class="relative">
            <input id="password" name="password" type="password" required minlength="6"
              class="w-full px-4 py-2.5 pr-12 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-800 dark:text-white focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none transition"
              placeholder="At least 6 characters" />
            <button type="button" id="toggle-pw" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 text-sm">Show</button>
          </div>
        </div>
        <div>
          <label for="confirm-password" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Confirm Password</label>
          <input id="confirm-password" name="confirm-password" type="password" required minlength="6"
            class="w-full px-4 py-2.5 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-800 dark:text-white focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none transition"
            placeholder="Re-enter password" />
        </div>

        <div id="error-msg" class="hidden text-sm text-rose-600 dark:text-rose-400 bg-rose-50 dark:bg-rose-900/30 border border-rose-200 dark:border-rose-800 rounded-lg p-3"></div>
        <div id="success-msg" class="hidden text-sm text-emerald-600 dark:text-emerald-400 bg-emerald-50 dark:bg-emerald-900/30 border border-emerald-200 dark:border-emerald-800 rounded-lg p-3"></div>

        <button type="submit" id="submit-btn"
          class="w-full py-2.5 px-4 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 text-white font-medium rounded-lg shadow-lg shadow-indigo-500/30 transition disabled:opacity-50 disabled:cursor-not-allowed">
          <span id="btn-text">Set Password</span>
          <svg id="btn-spinner" class="hidden animate-spin mx-auto h-5 w-5 text-white" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
          </svg>
        </button>
      </form>

      <div class="mt-6 pt-6 border-t border-slate-200 dark:border-slate-700">
        <p class="text-xs text-slate-500 dark:text-slate-400 text-center">
          After setting the password, log in with:<br/>
          <code class="px-1.5 py-0.5 bg-slate-100 dark:bg-slate-700 rounded text-indigo-600 dark:text-indigo-400">rohit.deore@ashapuricomputer.in</code>
        </p>
        <p class="text-center mt-4">
          <a href="/login.html" class="text-sm text-indigo-600 dark:text-indigo-400 hover:underline">← Back to Login</a>
        </p>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('toggle-pw').addEventListener('click', (e) => {
      const inp = document.getElementById('password');
      const isPw = inp.type === 'password';
      inp.type = isPw ? 'text' : 'password';
      e.target.textContent = isPw ? 'Hide' : 'Show';
    });

    document.getElementById('setup-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const key = document.getElementById('key').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirm-password').value;
      const errEl = document.getElementById('error-msg');
      const successEl = document.getElementById('success-msg');
      const btn = document.getElementById('submit-btn');
      const txt = document.getElementById('btn-text');
      const spin = document.getElementById('btn-spinner');

      errEl.classList.add('hidden');
      successEl.classList.add('hidden');

      if (password !== confirmPassword) {
        errEl.textContent = 'Passwords do not match.';
        errEl.classList.remove('hidden');
        return;
      }
      if (password.length < 6) {
        errEl.textContent = 'Password must be at least 6 characters.';
        errEl.classList.remove('hidden');
        return;
      }

      btn.disabled = true; txt.classList.add('hidden'); spin.classList.remove('hidden');

      try {
        const res = await fetch('/api/auth/setup-super-admin', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ key, password }),
        });
        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.detail || 'Setup failed.');
        }
        successEl.innerHTML = `✅ ${data.message}<br/>Login email: <code>${data.email}</code><br/><a href="/login.html" class="text-indigo-600 dark:text-indigo-400 hover:underline font-medium">Click here to login →</a>`;
        successEl.classList.remove('hidden');
      } catch (err) {
        errEl.textContent = err.message || 'Setup failed.';
        errEl.classList.remove('hidden');
        btn.disabled = false; txt.classList.remove('hidden'); spin.classList.add('hidden');
      }
    });
  </script>
</body>
</html>
